<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420"
     viewBox="0 0 960 420" font-family="'Segoe UI','Calibri','Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#606676"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#F7662D"/>
  </marker>
  <marker id="an" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A81845"/>
  </marker>
</defs>
<rect width="960" height="420" fill="#FFFFFF"/>
<circle cx="480" cy="40" r="9" fill="#003654"/>
<text x="504" y="45" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400" font-style="italic">employee logs a shift whose oc_role is grants_co</text>
<path d="M 480,49 L 480,92" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="340" y="94" width="280" height="96" rx="7" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="480.0" y="121" font-size="14" fill="#003654" text-anchor="middle" font-weight="600">UNCONSUMED</text>
<text x="480.0" y="138" font-size="11" fill="#606676" text-anchor="middle" font-weight="400">oc_date · window_end  set</text>
<text x="480.0" y="153.5" font-size="11" fill="#606676" text-anchor="middle" font-weight="400">co_date · co_entry  null</text>
<rect x="710" y="94" width="230" height="96" rx="7" fill="#E6F4EC" stroke="#9CCFB4" stroke-width="1.3"/>
<text x="825.0" y="121" font-size="14" fill="#0B6B3A" text-anchor="middle" font-weight="600">CONSUMED</text>
<text x="825.0" y="138" font-size="11" fill="#0B6B3A" text-anchor="middle" font-weight="400">co_date · co_entry  set</text>
<text x="825.0" y="153.5" font-size="11" fill="#0B6B3A" text-anchor="middle" font-weight="400" font-style="italic">the day off has been taken</text>
<rect x="20" y="94" width="230" height="96" rx="7" fill="#EEF1F4" stroke="#D5D9E0" stroke-width="1.3"/>
<text x="135.0" y="121" font-size="14" fill="#606676" text-anchor="middle" font-weight="600">DELETED</text>
<text x="135.0" y="138" font-size="11" fill="#606676" text-anchor="middle" font-weight="400">no CO had claimed it</text>
<text x="135.0" y="153.5" font-size="11" fill="#606676" text-anchor="middle" font-weight="400" font-style="italic">the right is given back</text>
<path d="M 340,128 L 250,128" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="251.045" y="102.5" width="87.91000000000001" height="16.5" fill="#FFFFFF"/>
<text x="295" y="112" font-size="10.5" fill="#606676" text-anchor="middle" font-weight="400">granting shift</text>
<rect x="270.5225" y="114.5" width="48.955000000000005" height="16.5" fill="#FFFFFF"/>
<text x="295" y="124" font-size="10.5" fill="#606676" text-anchor="middle" font-weight="400">cleared</text>
<path d="M 620,128 L 710,128" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="634.9575" y="102.5" width="60.085" height="16.5" fill="#FFFFFF"/>
<text x="665" y="112" font-size="10.5" fill="#606676" text-anchor="middle" font-weight="400">CO logged</text>
<rect x="634.9575" y="114.5" width="60.085" height="16.5" fill="#FFFFFF"/>
<text x="665" y="124" font-size="10.5" fill="#606676" text-anchor="middle" font-weight="400">in window</text>
<path d="M 825,190 L 825,232 L 480,232 L 480,192" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="550.805" y="218" width="202.39000000000001" height="17" fill="#FFFFFF"/>
<text x="652" y="228" font-size="11" fill="#006096" text-anchor="middle" font-weight="400">CO cleared — entitlement released</text>
<rect x="560" y="286" width="380" height="74" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="575" y="311.5" font-size="12.5" fill="#A81845" text-anchor="start" font-weight="600">Refused while consumed</text>
<text x="575" y="328.5" font-size="11" fill="#A81845" text-anchor="start" font-weight="400">Removing the granting shift is blocked for as long as</text>
<text x="575" y="344.0" font-size="11" fill="#A81845" text-anchor="start" font-weight="400">a CO depends on it: “a CO on &lt;date&gt; depends on this entry”.</text>
<path d="M 825,190 L 825,284" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#an)"/>
<rect x="20" y="286" width="500" height="74" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.3"/>
<text x="35" y="311.5" font-size="12.5" fill="#003654" text-anchor="start" font-weight="600">The two refusals in plain terms</text>
<text x="35" y="328.5" font-size="11" fill="#606676" text-anchor="start" font-weight="400">An employee cannot delete the on-call shift that justified a day</text>
<text x="35" y="344.0" font-size="11" fill="#606676" text-anchor="start" font-weight="400">off already taken, nor take a day off that was never earned.</text>
<text x="0" y="406" font-size="11" fill="#F7662D" text-anchor="start" font-weight="700" letter-spacing="0.6">Figure 6</text>
<text x="58" y="406" font-size="11" fill="#606676" text-anchor="start" font-weight="400">Entitlement record lifecycle — one row per earned compensatory day, consumed at most once</text>
</svg>
