    <path d="M0,0 L10,5 L0,10 z" fill="#606676"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#F7662D"/>
