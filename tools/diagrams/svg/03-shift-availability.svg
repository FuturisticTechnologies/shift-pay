<rect width="960" height="700" fill="#FFFFFF"/>
<rect x="350.0" y="15.0" width="260" height="46" rx="23.0" fill="#003654" stroke="#003654" stroke-width="1.3"/>
<text x="480" y="43.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">A date, and a user</text>
<path d="M 480,61 L 480,84" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<polygon points="480,86.0 630.0,132 480,178.0 330.0,132" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="480" y="129.5" font-size="11.8" fill="#003654" text-anchor="middle" font-weight="600">Is it a weekend, or a date in</text>
