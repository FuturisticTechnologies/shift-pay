<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700"
     viewBox="0 0 960 700" font-family="'Segoe UI','Calibri','Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5"
