<rect x="707.8575" y="115.5" width="28.285" height="17.5" fill="#FFFFFF"/>
<text x="722" y="126" font-size="11.5" fill="#003654" text-anchor="middle" font-weight="400">yes</text>
<rect x="90" y="204" width="250" height="64" rx="7" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="215.0" y="229" font-size="12" fill="#003654" text-anchor="middle" font-weight="600" font-family="'Consolas','Cascadia Mono','Courier New',monospace">allow_weekday = true</text>
<text x="215.0" y="246.5" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400">the weekday shift types</text>
<rect x="690" y="204" width="250" height="64" rx="7" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="815.0" y="228.5" font-size="11.5" fill="#003654" text-anchor="middle" font-weight="600" font-family="'Consolas','Cascadia Mono','Courier New',monospace">allow_weekend_holiday = true</text>
<text x="815.0" y="246.0" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400">the weekend and holiday types</text>
<path d="M 215,268 L 215,316" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<polygon points="215,318.0 365.0,366 215,414.0 65.0,366" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="215" y="363.5" font-size="11.8" fill="#003654" text-anchor="middle" font-weight="600">Does that list include</text>
<text x="215" y="378.3" font-size="11.8" fill="#003654" text-anchor="middle" font-weight="600">a consumes_co type?</text>
