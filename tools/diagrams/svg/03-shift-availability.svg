<text x="215" y="509.5" font-size="11.8" fill="#003654" text-anchor="middle" font-weight="600">Does an unconsumed entitlement</text>
<text x="215" y="524.3" font-size="11.8" fill="#003654" text-anchor="middle" font-weight="600">window cover this date?</text>
<rect x="455" y="482" width="210" height="62" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="560.0" y="507.5" font-size="12.5" fill="#A81845" text-anchor="middle" font-weight="600">Remove the CO</text>
<text x="560.0" y="525.0" font-size="11.5" fill="#A81845" text-anchor="middle" font-weight="400">it has not been earned</text>
<path d="M 375,513 L 455,513" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#an)"/>
<rect x="403.905" y="496.5" width="22.19" height="17.5" fill="#FFFFFF"/>
<text x="415" y="507" font-size="11.5" fill="#A81845" text-anchor="middle" font-weight="400">no</text>
<path d="M 560,544 L 560,600" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M 215,562 L 215,600" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round"/>
<rect x="245.105" y="574" width="85.79" height="17" fill="#FFFFFF"/>
<text x="288" y="584" font-size="11" fill="#0B6B3A" text-anchor="middle" font-weight="400">yes — keep it</text>
<path d="M 815,268 L 815,600" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="32" y1="600" x2="815" y2="600" stroke="#606676" stroke-width="1.4"/>
<path d="M 480,600 L 480,611" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="280.0" y="613.0" width="400" height="46" rx="23.0" fill="#006096" stroke="#006096" stroke-width="1.3"/>
<text x="480" y="641.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">The allowed shift list for that date</text>
<text x="0" y="690" font-size="11" fill="#F7662D" text-anchor="start" font-weight="700" letter-spacing="0.6">Figure 3</text>
<text x="58" y="690" font-size="11" fill="#606676" text-anchor="start" font-weight="400">Shift availability — resolved per date, per user, and re-checked server-side on every write</text>
</svg>
