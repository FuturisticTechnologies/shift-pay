<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724"
     viewBox="0 0 960 724" font-family="'Segoe UI','Calibri','Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#606676"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#F7662D"/>
  </marker>
  <marker id="an" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A81845"/>
  </marker>
</defs>
<rect width="960" height="724" fill="#FFFFFF"/>
<rect x="140.0" y="9.0" width="420" height="46" rx="23.0" fill="#003654" stroke="#003654" stroke-width="1.3"/>
<text x="350" y="37.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">Employee picks a shift for a date</text>
<path d="M 350,55 L 350,84" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="110" y="86" width="480" height="74" rx="7" fill="#FDF1E0" stroke="#E8C48A" stroke-width="1.3"/>
<text x="125" y="112.5" font-size="13.5" fill="#B26A00" text-anchor="start" font-weight="600">Guard</text>
<text x="125" y="130.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="400">Is the month locked?</text>
<text x="125" y="146.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="400">Is this shift allowed on this date, for this user?</text>
<rect x="110" y="194" width="480" height="96" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.3"/>
<circle cx="133" cy="215.5" r="10.5" fill="#F7662D"/>
<text x="133" y="219.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="152" y="220.5" font-size="13.5" fill="#003654" text-anchor="start" font-weight="600">Release the previous shift</text>
<text x="152" y="238.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">Did the old shift grant a CO?  Delete the entitlement —</text>
<text x="152" y="254.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">unless a CO already claimed it, which refuses the change.</text>
<text x="152" y="270.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">Was the old shift the CO?  Release what it consumed.</text>
<rect x="110" y="324" width="480" height="80" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.3"/>
<circle cx="133" cy="345.5" r="10.5" fill="#F7662D"/>
<text x="133" y="349.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="152" y="350.5" font-size="13.5" fill="#003654" text-anchor="start" font-weight="600">Reserve for the new shift</text>
<text x="152" y="368.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">Is the new shift the CO?  Claim the earliest unconsumed</text>
<text x="152" y="384.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">entitlement whose window covers this date.</text>
<rect x="110" y="438" width="480" height="52" rx="7" fill="#006096" stroke="#006096" stroke-width="1.3"/>
<text x="350.0" y="469.5" font-size="14.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Write the day row</text>
<rect x="110" y="524" width="480" height="80" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.3"/>
<circle cx="133" cy="545.5" r="10.5" fill="#F7662D"/>
<text x="133" y="549.5" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="152" y="550.5" font-size="13.5" fill="#003654" text-anchor="start" font-weight="600">Commit for the new shift</text>
<text x="152" y="568.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">Grants a CO?  Insert an entitlement, window = 7 weekdays.</text>
<text x="152" y="584.0" font-size="11.5" fill="#606676" text-anchor="start" font-weight="400">Is the CO?  Mark the reserved entitlement consumed.</text>
<rect x="110" y="638" width="480" height="50" rx="7" fill="#F2F6F9" stroke="#D5D9E0" stroke-width="1.3"/>
<text x="350.0" y="667" font-size="13" fill="#003654" text-anchor="middle" font-weight="600">Recompute the weekly and monthly aggregates</text>
<path d="M 350,160 L 350,192" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M 350,290 L 350,322" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M 350,404 L 350,436" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M 350,490 L 350,522" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M 350,604 L 350,636" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="700" y="92.0" width="250" height="62" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="715" y="117.5" font-size="12.5" fill="#A81845" text-anchor="start" font-weight="600">Refused</text>
<text x="715" y="134.3" font-size="10.8" fill="#A81845" text-anchor="start" font-weight="400">locked, or not allowed on this date</text>
<path d="M 590,123 L 700,123" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#an)"/>
<rect x="700" y="205.0" width="250" height="74" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="715" y="230.5" font-size="12.5" fill="#A81845" text-anchor="start" font-weight="600">Refused</text>
<text x="715" y="247.3" font-size="10.8" fill="#A81845" text-anchor="start" font-weight="400">a CO on a later date</text>
<text x="715" y="262.6" font-size="10.8" fill="#A81845" text-anchor="start" font-weight="400">already depends on this entry</text>
<path d="M 590,242 L 700,242" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#an)"/>
<rect x="700" y="327.0" width="250" height="74" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="715" y="352.5" font-size="12.5" fill="#A81845" text-anchor="start" font-weight="600">Refused</text>
<text x="715" y="369.3" font-size="10.8" fill="#A81845" text-anchor="start" font-weight="400">no entitlement window</text>
<text x="715" y="384.6" font-size="10.8" fill="#A81845" text-anchor="start" font-weight="400">covers this date</text>
<path d="M 590,364 L 700,364" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#an)"/>
<text x="0" y="716" font-size="11" fill="#F7662D" text-anchor="start" font-weight="700" letter-spacing="0.6">Figure 4</text>
<text x="58" y="716" font-size="11" fill="#606676" text-anchor="start" font-weight="400">The three-phase day change — the entitlement decision brackets the write, because it must be made before the row exists and recorded after</text>
</svg>
