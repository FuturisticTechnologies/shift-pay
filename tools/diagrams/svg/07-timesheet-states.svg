<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="'Segoe UI','Calibri','Helvetica Neue',Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#606676"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#F7662D"/>
  </marker>
  <marker id="an" viewBox="0 0 10 10" refX="9.2" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A81845"/>
  </marker>
</defs>
<rect width="960" height="440" fill="#FFFFFF"/>
<rect x="20" y="150" width="200" height="96" rx="7" fill="#F2F6F9" stroke="#D5D9E0" stroke-width="1.3"/>
<text x="120.0" y="178" font-size="15" fill="#003654" text-anchor="middle" font-weight="600">OPEN</text>
<text x="120.0" y="195.5" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400">no timesheet row</text>
<text x="120.0" y="211.5" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400" font-style="italic">editable</text>
<rect x="320" y="150" width="230" height="96" rx="7" fill="#F2F6F9" stroke="#006096" stroke-width="1.3"/>
<text x="435.0" y="178" font-size="15" fill="#003654" text-anchor="middle" font-weight="600">SUBMITTED</text>
<text x="435.0" y="195.5" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400">awaiting a decision</text>
<text x="435.0" y="211.5" font-size="11.5" fill="#606676" text-anchor="middle" font-weight="400" font-style="italic">locked for the employee</text>
<rect x="700" y="34" width="240" height="92" rx="7" fill="#E6F4EC" stroke="#9CCFB4" stroke-width="1.3"/>
<text x="820.0" y="62" font-size="15" fill="#0B6B3A" text-anchor="middle" font-weight="600">APPROVED</text>
<text x="820.0" y="79.5" font-size="11.5" fill="#0B6B3A" text-anchor="middle" font-weight="400" font-style="italic">locked — final</text>
<rect x="700" y="268" width="240" height="92" rx="7" fill="#FBE9EF" stroke="#E4A0B5" stroke-width="1.3"/>
<text x="820.0" y="296" font-size="15" fill="#A81845" text-anchor="middle" font-weight="600">REJECTED</text>
<text x="820.0" y="313.5" font-size="11.5" fill="#A81845" text-anchor="middle" font-weight="400" font-style="italic">unlocked — back with</text>
<text x="820.0" y="329.5" font-size="11.5" fill="#A81845" text-anchor="middle" font-weight="400" font-style="italic">the employee</text>
<path d="M 220,198 L 320,198" fill="none" stroke="#606676" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="247.51" y="170" width="44.980000000000004" height="17" fill="#FFFFFF"/>
<text x="270" y="180" font-size="11" fill="#003654" text-anchor="middle" font-weight="400">submit</text>
<text x="313" y="232" font-size="10.2" fill="#606676" text-anchor="end" font-weight="400">every weekday logged,</text>
<text x="313" y="245" font-size="10.2" fill="#606676" text-anchor="end" font-weight="400">inside the window</text>
<path d="M 550,180 L 640,180 L 640,80 L 700,80" fill="none" stroke="#0B6B3A" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M 700,80 L 690,75 L 690,85 z" fill="#0B6B3A"/>
<rect x="614.595" y="122" width="50.81" height="17" fill="#FFFFFF"/>
<text x="640" y="132" font-size="11" fill="#0B6B3A" text-anchor="middle" font-weight="400">approve</text>
<path d="M 550,216 L 640,216 L 640,314 L 700,314" fill="none" stroke="#A81845" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M 700,314 L 690,309 L 690,319 z" fill="#A81845"/>
<rect x="617.51" y="252" width="44.980000000000004" height="17" fill="#FFFFFF"/>
<text x="640" y="262" font-size="11" fill="#A81845" text-anchor="middle" font-weight="400">reject</text>
<text x="640" y="356" font-size="10.2" fill="#606676" text-anchor="middle" font-weight="400">comment mandatory</text>
<path d="M 820,360 L 820,402 L 435,402 L 435,248" fill="none" stroke="#006096" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="515.145" y="388" width="225.71" height="17" fill="#FFFFFF"/>
<text x="628" y="398" font-size="11" fill="#006096" text-anchor="middle" font-weight="400">resubmit — same row, decision cleared</text>
<rect x="20" y="296" width="260" height="76" rx="7" fill="#FDF1E0" stroke="#E8C48A" stroke-width="1.3"/>
<text x="35" y="321.5" font-size="12.5" fill="#B26A00" text-anchor="start" font-weight="600">The lock is conditional</text>
<text x="35" y="338.5" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="400">A month is locked when a row exists</text>
<text x="35" y="354.0" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="400">and its status is not rejected.</text>
<text x="0" y="426" font-size="11" fill="#F7662D" text-anchor="start" font-weight="700" letter-spacing="0.6">Figure 7</text>
<text x="58" y="426" font-size="11" fill="#606676" text-anchor="start" font-weight="400">Monthly timesheet states — rejection is not terminal, it is the mechanism that returns the month to the employee</text>
</svg>
